name: CI

# 배포 전 회귀 게이트 — push/PR 마다 tests/ 를 전부 돌린다.
#
# ★이 저장소에는 CI 가 없었다 (2026-08-07 발견). 시험 파일이 ★55개로 백엔드(43개)보다
#   많은데 아무도 안 돌리는 상태였다. PR 을 올려도 통과하는지 알 수 없었다.
#
# ★외부 의존이 없다 — conftest 가 in-memory SQLite(StaticPool)를 쓰고 ML 시험은
#   라이브러리가 없으면 스스로 건너뛴다. DB·네트워크를 띄울 필요가 없다.
#   실측: 231 passed · 1 skipped in 10.93s
on:
  push:
    branches: ['**']
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: pip

      - name: 의존성 설치
        run: |
          python -m pip install --upgrade pip
          # ★requirements.txt 가 아니라 requirements-ci.txt 다 — 이유는 그 파일 주석에 있다
          pip install -r requirements-ci.txt

      - name: 시험
        env:
          PYTHONPATH: .
          PYTHONIOENCODING: utf-8
        run: pytest -q
